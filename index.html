:root {
  --background: #f4f7fb;
  --foreground: #182c47;
  --card: #fff;
  --primary: #285caf;
  --border: #dce4ef;
  --radius: 14px;
}
.dark {
  --background: #111e31;
  --foreground: #f1f5fc;
  --card: #1a2b43;
  --primary: #85b1f5;
  --border: #344660;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--background);
  color: var(--foreground);
  font-size: 16px;
  line-height: 1.6;
}
button,
a,
input {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  font: inherit;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid #73a4e9;
  outline-offset: 3px;
}
button {
  transition: background 0.15s,
    border-color 0.15s,
    transform 0.15s;
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
svg {
  flex-shrink: 0;
}
a {
  color: inherit;
  text-decoration: none;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: clamp(24px, 3vw, 34px);
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.5;
}
h2 {
  font-size: 21px;
  font-weight: 700;
}
h3 {
  font-size: 17px;
  font-weight: 650;
}
.workspace {
  max-width: 1280px;
  margin: auto;
  padding: 0 40px 48px;
}
.topbar {
  height: 94px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 22px;
  white-space: nowrap;
}
.brand strong > span {
  font-size: 16px;
  font-weight: 500;
  margin-left: 8px;
  color: #62748c;
}
.brand-icon {
  display: grid;
  place-items: center;
  background: #234d87;
  color: white;
  width: 40px;
  height: 40px;
  border-radius: 12px;
}
.eyebrow {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 1.5px;
  color: #647993;
}
.page-intro {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 32px 0 26px;
  gap: 20px;
}
.page-intro .eyebrow {
  font-size: 14px;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.pill {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #e6edf7;
  padding: 7px 14px;
  border-radius: 30px;
  font-size: 14px;
  color: #456185;
  white-space: nowrap;
}
.book-tabs[data-slot] {
  height: 50px !important;
  max-width: 100%;
  width: 320px;
  background: #e5ebf4;
  padding: 5px;
  border-radius: 12px;
}
.book-tabs [data-slot='tabs-trigger'] {
  padding: 10px 22px;
  font-size: 16px;
}
.book-tabs [data-active] {
  color: #234f90 !important;
  background: #fff !important;
}
.study-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(340px, 1fr);
  gap: 24px;
  margin-top: 24px;
  align-items: start;
}
.panel {
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  padding: 26px;
  box-shadow: 0 5px 20px #203d6603;
}
.section-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  margin-bottom: 22px;
}
.section-head > span,
.muted {
  font-size: 14px;
  color: #63758e;
}
.unit-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.unit-card {
  position: relative;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 17px 18px;
  background: white;
  display: flex;
  flex-direction: column;
  min-height: 112px;
  gap: 2px;
  overflow: hidden;
}
.unit-card:hover {
  background: #f4f8ff;
  border-color: #91b1dc;
}
.unit-card.selected {
  background: #eef4ff;
  border: 1.5px solid #376ac0;
  box-shadow: 0 0 0 2px #2a5ca910;
}
.unit-card > strong {
  font-size: 17px;
  position: relative;
}
.unit-card > span:not(.unit-no) {
  font-size: 13px;
  color: #62758f;
  position: relative;
}
.unit-no {
  position: absolute;
  right: 15px;
  top: 5px;
  font-size: 40px;
  line-height: 1.4;
  font-weight: 300;
  color: #e6edf6;
}
.selected .unit-no {
  color: #ccdaf1;
}
.unit-count {
  margin-top: 8px;
}
.setup {
  border-top: 4px solid #315d9d;
  position: sticky;
  top: 20px;
}
.setup > .eyebrow {
  margin-bottom: 8px;
}
.setup h2 {
  margin-bottom: 20px;
}
.mode-preview {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 2px 10px;
  padding: 17px 0;
  border-bottom: 1px solid var(--border);
}
.mode-preview svg {
  grid-row: span 2;
  color: #426a9f;
}
.mode-preview span {
  font-size: 14px;
  color: #67778c;
}
.ready-note {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: #62758f;
  margin: 22px 0 16px;
}
.primary,
.secondary,
.text-button,
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: 10px;
  min-height: 46px;
  padding: 10px 18px;
  font-size: 15px;
  font-weight: 600;
}
.primary {
  border: 1px solid #285caf;
  background: #285caf;
  color: white;
}
.primary:hover {
  background: #204e96;
}
.secondary {
  border: 1px solid var(--border);
  background: white;
  color: #355476;
}
.secondary:hover {
  background: #eff4fc;
}
.text-button {
  background: transparent;
  color: #486994;
  border: 0;
  padding: 8px 10px;
}
.icon-button {
  background: #f1f5fb;
  border: 0;
  width: 44px;
  padding: 8px;
  color: #355d91;
}
.setup > .primary {
  width: 100%;
}
.top-actions,
.button-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.top-actions .text-button {
  font-size: 14px;
}
.stats {
  display: flex;
  gap: 30px;
  padding: 22px 0 0;
  border-top: 1px solid var(--border);
  margin-top: 22px;
}
.stats strong {
  font-size: 23px;
  font-weight: 650;
  margin-right: 6px;
  color: #244d86;
}
.stats span {
  font-size: 13px;
  color: #6c7c92;
}
.footer-note {
  font-size: 13px;
  color: #708097;
  text-align: center;
  margin-top: 26px;
}
.mode-tabs[data-slot] {
  width: 100%;
  height: auto !important;
  background: #eef2f8;
  padding: 4px;
}
.mode-tabs [data-slot='tabs-trigger'] {
  font-size: 14px;
  padding: 10px 6px;
  white-space: normal;
  min-height: 44px;
}
.mode-tabs [data-active] {
  background: #fff !important;
  color: #214c90 !important;
}
.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 20px 0;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-size: 14px;
  color: #50657f;
}
.field [data-slot='select-trigger'] {
  width: 100%;
  height: 44px;
  font-size: 14px;
  background: #fff;
}
.field input {
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px 12px;
  background: #fff;
  color: var(--foreground);
  font-size: 16px;
  width: 100%;
}
.helper {
  font-size: 13px;
  color: #77859a;
  margin-top: 8px;
}
.scope-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 14px;
}
.notice {
  padding: 12px 16px;
  border-radius: 10px;
  background: #fff2d9;
  border: 1px solid #f0dcaa;
  color: #7f5c22;
  font-size: 14px;
  margin: 16px 0;
}
.session-wrap {
  max-width: 800px;
  margin: 30px auto;
}
.session-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}
.session-panel {
  text-align: center;
  padding: 36px;
}
.session-panel .prompt {
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 650;
  line-height: 1.5;
  margin: 20px 0 8px;
  overflow-wrap: anywhere;
}
.audio-orb {
  display: grid;
  place-items: center;
  width: 96px;
  height: 96px;
  margin: 24px auto 18px;
  border-radius: 50%;
  background: #e9f1ff;
  color: #3264ad;
  box-shadow: 0 0 0 12px #f6f9ff;
}
.audio-orb svg {
  width: 38px;
  height: 38px;
}
.timer {
  font-variant-numeric: tabular-nums;
  font-size: 32px;
  color: #315e9f;
  margin: 8px 0;
}
.answer-input {
  display: block;
  width: 100%;
  margin: 25px 0 15px;
  border: 1px solid #ccd8e8;
  background: #fafcff;
  border-radius: 12px;
  padding: 16px;
  font-size: 23px;
  text-align: center;
  color: #213d64;
}
.session-panel .button-row {
  justify-content: center;
}
.session-panel [data-slot='progress'] {
  margin-bottom: 24px;
}
.small {
  font-size: 14px;
}
.answer-card {
  text-align: left;
  background: #eff5ff;
  padding: 20px;
  border-radius: 12px;
  margin: 20px 0;
}
.answer-card strong {
  font-size: 25px;
}
.answer-card .ipa {
  margin: 4px 0 10px;
}
.pos {
  display: inline-block;
  background: #e8edf5;
  border-radius: 5px;
  padding: 2px 7px;
  font-size: 13px;
  color: #4f6585;
  margin-right: 8px;
  white-space: nowrap;
}
.ipa {
  color: #73829a;
  font-size: 14px;
}
.table-wrap {
  overflow-x: auto;
  margin-top: 20px;
}
[data-slot='table'] {
  font-size: 15px;
}
[data-slot='table-head'] {
  font-size: 13px;
  color: #637a94;
  height: 42px;
}
[data-slot='table-cell'] {
  padding: 14px 10px;
  vertical-align: top;
}
.result-en {
  font-size: 17px;
  font-weight: 600;
  white-space: normal;
  min-width: 110px;
}
.result-zh {
  min-width: 130px;
  white-space: normal;
}
.result-answer {
  white-space: normal;
  overflow-wrap: anywhere;
  min-width: 100px;
  color: #60718b;
}
.grade {
  border-radius: 7px;
  border: 1px solid #ccd8e8;
  padding: 6px 9px;
  min-height: 36px;
  font-size: 13px;
  white-space: nowrap;
}
.grade.correct {
  background: #e8f6ee;
  color: #26714a;
  border-color: #b7dbc6;
}
.grade.wrong {
  background: #fff0ee;
  color: #a44b43;
  border-color: #efc6c0;
}
.grade.pending {
  background: #fff6df;
  color: #8c691f;
  border-color: #e7d7a9;
}
.review-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.score {
  font-size: 34px;
  color: #2c5ca0;
  font-weight: 650;
}
.review-list {
  margin-top: 20px;
}
.word-list {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}
.word-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  background: #fff;
}
.word-row strong {
  font-size: 20px;
}
.word-row p {
  margin-top: 4px;
}
.word-row .button-row {
  flex-shrink: 0;
}
.check-progress {
  margin: 20px 0;
}
.backup-panel {
  max-width: 640px;
  margin: 30px auto;
}
.backup-panel h2 {
  margin-bottom: 14px;
}
.backup-panel p {
  color: #687b93;
  font-size: 15px;
  margin: 12px 0;
}
.backup-panel .button-row {
  margin-top: 18px;
}
.empty-state {
  text-align: center;
  padding: 40px 15px;
  color: #607797;
}
.empty-state svg {
  margin: 0 auto 12px;
}
.session-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}
.session-nav > span {
  font-size: 13px;
  color: #73839a;
}
.practice-label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.mobile-line {
  display: none;
}
.answer-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.table-audio {
  vertical-align: middle;
  margin-left: 6px;
  border: 0;
  background: transparent;
  color: #486e9b;
  padding: 6px;
}
.switch-line {
  display: flex;
  gap: 8px;
  align-items: center;
}
.loading {
  padding: 30px;
  text-align: center;
  color: #617792;
}
.success-note {
  background: #eaf7ef;
  border: 1px solid #c2e3cf;
  color: #2b7250;
  padding: 12px 16px;
  border-radius: 10px;
  margin-top: 16px;
  font-size: 14px;
}
@media (max-width: 900px) {
  .workspace {
    padding: 0 24px 32px;
  }
  .study-layout {
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .panel {
    padding: 20px;
  }
  .unit-card {
    padding: 15px 12px;
  }
  .unit-card > span:not(.unit-no) {
    font-size: 12px;
  }
  .brand strong > span {
    display: none;
  }
  .topbar > .eyebrow {
    display: none;
  }
  .top-actions {
    gap: 2px;
  }
}
@media (max-width: 680px) {
  .workspace {
    padding: 0 16px 26px;
  }
  .topbar {
    height: 76px;
  }
  .brand {
    font-size: 20px;
    gap: 8px;
  }
  .brand-icon {
    width: 34px;
    height: 34px;
  }
  .top-actions .text-button {
    padding: 8px;
    gap: 5px;
    font-size: 13px;
  }
  .top-actions .text-button svg {
    width: 16px;
  }
  .page-intro {
    margin: 23px 0 22px;
  }
  .page-intro > .pill {
    display: none;
  }
  .page-intro .eyebrow {
    font-size: 13px;
  }
  .study-layout {
    display: flex;
    flex-direction: column;
    margin-top: 18px;
    gap: 18px;
  }
  .study-layout > section {
    width: 100%;
  }
  .setup {
    position: static;
    order: -1;
  }
  .unit-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .panel {
    padding: 20px;
    border-radius: 16px;
  }
  .setup h2 {
    font-size: 20px;
    margin-bottom: 15px;
  }
  .field-grid {
    margin: 16px 0;
    gap: 12px;
  }
  .ready-note {
    margin: 16px 0 12px;
    font-size: 13px;
  }
  .book-tabs[data-slot] {
    width: 100%;
  }
  .unit-picker-mobile {
    display: block;
  }
  .section-head {
    margin-bottom: 16px;
  }
  .session-wrap {
    margin: 20px auto;
  }
  .session-top {
    align-items: flex-start;
  }
  .session-panel {
    padding: 24px 18px;
  }
  .session-panel .prompt {
    font-size: 30px;
  }
  .session-nav {
    gap: 8px;
  }
  .session-nav > span {
    display: none;
  }
  .answer-input {
    font-size: 20px;
  }
  .review-header {
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .review-header .button-row {
    width: 100%;
  }
  .word-row {
    padding: 13px;
  }
  .word-row strong {
    font-size: 18px;
  }
  .word-row .button-row {
    gap: 3px;
  }
  .word-row .icon-button {
    width: 38px;
    min-height: 38px;
  }
  .stats {
    gap: 20px;
  }
  .stats strong {
    font-size: 20px;
  }
  .table-wrap {
    margin-left: -8px;
    margin-right: -8px;
  }
  .footer-note {
    font-size: 12px;
  }
  .backup-panel {
    padding: 22px;
  }
  .mode-tabs [data-slot='tabs-trigger'] {
    font-size: 13px;
  }
  .top-actions .backup-text {
    display: none;
  }
}
